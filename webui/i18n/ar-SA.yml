"hint.rail": "Shift+نقر على مقاطعتين = إنشاء سكة تلقائيًا (برًّا فقط، ويمكن عبور المضائق/القنوات)؛ النقر على سكة = تغيير المستوى/الحذف؛ النقر على مقاطعة = إضافة/إزالة نقطة إمداد."
"hint.terrain": "انقر مقاطعة، ثم اختر التضاريس أدناه واحفظ. يمكن أيضًا التوليد التلقائي أو تصدير terrain.bmp من definition.csv."
"edit.hintGeneral": "النقر على مقاطعة يجعل <b>ولايتها / منطقتها الاستراتيجية / قارتها</b> هي الهدف (تُحاط المنطقة بإطار)؛ <b>Shift+نقر</b> للإضافة/الإزالة. Shift+نقر على منطقة فارغة يضيفها مباشرة. طبقة الولايات تقبل البر والبحيرات فقط."

