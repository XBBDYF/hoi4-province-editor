# 韩语短语表: phr.<中文原文> = 韩语译文
# 这些是 app.js 里以中文字面量拼出来的界面文本(状态栏消息、参数表单、审计面板、地块信息等)。
# tp() 会先把整串做精确匹配, 再按"最长的键"做片段替换。
# 其它语言若没有自己的 phr-<lang>.yml, 会自动回退到这里(英文)。

